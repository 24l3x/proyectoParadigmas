server {
    listen 80;
    server_name localhost;

    # Regla 1: Si piden la raíz, entrega los archivos de la carpeta Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Regla 2: Si la petición empieza con /api/, mándasela al contenedor de Python
    location /api/ {
        # 'backend' es el nombre de tu servicio en docker-compose, y 8000 su puerto interno
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}